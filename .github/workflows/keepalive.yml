# Keeps the free Supabase project awake.
#
# A free-tier project pauses itself after ~7 days with no API traffic, and a
# paused project has to be resumed by hand from the dashboard. This sends one
# harmless read every three days so the song wall is never asleep when a guest
# opens the invitation.
#
# Setup: repo → Settings → Secrets and variables → Actions → New repository
# secret, twice:
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon / public key
#
# Until those exist the job simply skips, so it never shows up as a failure.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 4 */3 * *" # every 3rd day, 04:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the songs table
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY not set — nothing to ping yet."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/songs?select=id&limit=1")
          echo "HTTP $code"
          [ "$code" = "200" ]
